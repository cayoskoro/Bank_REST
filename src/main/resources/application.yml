#
# application.yml — главный конфигурационный файл Spring Boot.

Что нужно сделать:
  - Указать настройки подключения к базе данных.
  - Указать порт приложения.
  - Настроить параметры безопасности и JWT.
  - Включить Swagger UI.

server:
  port: 8080

spring:
  config:
    on-profile: ci,test
  datasource:
    driverClassName: ${SPRING_DB_DRIVER:org.h2.Driver} # org.postgresql.Driver
    url: ${SPRING_DB_URL:jdbc:h2:mem:bank} # jdbc:postgresql://localhost:5432:bank
    username: ${SPRING_DB_USERNAME:test}
    password: ${SPRING_DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
        format_sql: true
  sql:
    init:
      mode: embedded

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /api-docs-ui

encryptor:
  aes:
    iv-length: ${ENCRYPTOR_AES_IV_LENGTH:12}
    tag-length: ${ENCRYPTOR_AES_TAG_LENGTH:16}
    passphrase: ${ENCRYPTOR_AES_PASSPHRASE:testPassphrase123!}

